<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --void: #0b0f14;
      --panel: #131a23;
      --panel-2: #171f2a;
      --line: #222c39;
      --line-soft: #1a2029;
      --text: #e6ebf2;
      --muted: #93a1b3;
      --dim: #7f8da0;
      --signal: #f0a848;
      --bad: #e2694f;
      --good: #6fbf8a;

      --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* ── 배경 격자 ─────────────────────────── */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--line-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
      opacity: 0.7;
    }

    .layer {
      position: relative;
      z-index: 1;
    }

    /* ── 헤더 ─────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 15, 20, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      height: 54px;
    }

    .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 0 rgba(240, 168, 72, 0.55);
      animation: pulse 2.6s ease-out infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(240, 168, 72, 0.5); }
      70%  { box-shadow: 0 0 0 9px rgba(240, 168, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(240, 168, 72, 0); }
    }

    .nav-links {
      display: flex;
      gap: 26px;
    }

    .nav-links a {
      font-size: 13.5px;
      color: var(--dim);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--signal);
      border-bottom-color: var(--signal);
    }

    /* ── 첫 화면 ───────────────────────────── */
    .hero {
      padding: 52px 0 44px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 44px;
      align-items: start;
    }
