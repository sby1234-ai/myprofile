<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 - 비공개 자리 (Passkey)</title>
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #f0883e;
      --accent-hover: #d97706;
      --green-glow: #2ea043;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(240, 136, 62, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 8px;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .section-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .status-banner {
      background-color: rgba(46, 160, 67, 0.1);
      border: 1px solid var(--green-glow);
      color: #3fb950;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .log-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .log-section h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    pre {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 6px;
      color: var(--text-main);
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="section-title">
    03 비공개 자리
    <span class="header-tag">🔒 PASSKEY ONLY</span>
  </div>
  <p class="section-desc">
    여기부터는 저만 보는 자리입니다. 비밀번호는 없습니다 — 제 기기가 만든 패스키로만 열립니다.
  </p>

  <div id="statusBanner" class="status-banner"></div>

  <div class="grid">
    <!-- 로그인 영역 -->
    <div class="card">
      <h3>패스키로 로그인</h3>
      <div class="input-group">
        <label for="loginUsername">계정 이름</label>
        <input type="text" id="loginUsername" placeholder="예: test-a">
      </div>
      <button class="btn" onclick="loginWithPasskey()">패스키로 로그인</button>
    </div>

    <!-- 신규 등록 영역 -->
    <div class="card">
      <h3>새 계정 생성 (패스키 등록)</h3>
      <div class="input-group">
        <label for="registerUsername">계정 이름</label>
        <input type="text" id="registerUsername" placeholder="예: test-a">
      </div>
      <button class="btn" onclick="registerNewAccount()">패스키 등록 및 계정 생성</button>
    </div>
  </div>

  <!-- 요청/응답 로그 출력 영역 -->
  <div class="log-section">
    <h3>요청·응답 기록 (증거용 로그)</h3>
    <pre id="logOutput">// API 호출 및 Passkey 결과 로그가 여기에 표시됩니다.</pre>
  </div>
</div>

<script>
  const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

  function showStatus(msg) {
    const banner = document.getElementById('statusBanner');
    banner.style.display = 'block';
    banner.innerText = msg;
  }

  function appendLog(title, data) {
    const logEl = document.getElementById('logOutput');
    const time = new Date().toLocaleTimeString();
    logEl.innerText = `[${time}] ${title}\n` + JSON.stringify(data, null, 2) + `\n\n` + logEl.innerText;
  }

  // 1. 신규 계정 생성 및 패스키 등록
  async function registerNewAccount() {
    const username = document.getElementById('registerUsername').value.trim();
    if (!username) {
      alert('계정 이름을 입력해주세요.');
      return;
    }

    showStatus("패스키 등록을 진행 중입니다...");

    try {
      const res = await fetch('/api/passkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'register-start', username })
      });
      const startData = await res.json();
      appendLog("1-1. Register Start Response", startData);

      if (!res.ok) throw new Error(startData.error || '등록 옵션 수신 실패');

      const options = startData.options;
      options.authenticatorSelection = {
        ...options.authenticatorSelection,
        authenticatorAttachment: 'cross-platform',
        userVerification: 'preferred'
      };

      const attResp = await startRegistration(options);
      appendLog("1-2. WebAuthn Registration Credential", attResp);

      const verifyRes = await fetch('/api/passkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'register-finish', username, response: attResp })
      });
      const finishData = await verifyRes.json();
      appendLog("1-3. Register Finish Response", finishData);

      if (finishData.verified) {
        showStatus(`성공: '${username}' 계정 및 패스키 등록이 완료되었습니다!`);
      } else {
        throw new Error('패스키 검증 실패');
      }

    } catch (err) {
      console.error(err);
      appendLog("Error (Register)", err.message || err);
      showStatus(`오류 발생: ${err.message || '패스키 등록 취소됨'}`);
    }
  }

  // 2. 패스키 로그인
  async function loginWithPasskey() {
    const username = document.getElementById('loginUsername').value.trim();
    if (!username) {
      alert('계정 이름을 입력해주세요.');
      return;
    }

    showStatus("패스키 인증을 진행 중입니다...");

    try {
      const res = await fetch('/api/passkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'auth-start', username })
      });
      const startData = await res.json();
      appendLog("2-1. Auth Start Response", startData);

      if (!res.ok) throw new Error(startData.error || '인증 옵션 수신 실패');

      const authOptions = startData.options;
      authOptions.authenticatorSelection = {
        ...authOptions.authenticatorSelection,
        authenticatorAttachment: 'cross-platform',
        userVerification: 'preferred'
      };

      const asseResp = await startAuthentication(authOptions);
      appendLog("2-2. WebAuthn Auth Credential", asseResp);

      const verifyRes = await fetch('/api/passkey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'auth-finish', username, response: asseResp })
      });
      const finishData = await verifyRes.json();
      appendLog("2-3. Auth Finish Response", finishData);

      if (finishData.verified) {
        showStatus(`성공: '${username}' 계정 로그인 성공!`);
      } else {
        throw new Error(finishData.error || '인증 서명 검증 실패');
      }

    } catch (err) {
      console.error(err);
      appendLog("Error (Login)", err.message || err);
      showStatus(`오류 발생: ${err.message || '패스키 로그인 실패'}`);
    }
  }
</script>
</body>
</html>
